[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-sh"
version = "1.0.0"
description = "Modelo de situational handicapping NBA para ML, spread y totales"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
live = ["nba_api>=1.4", "requests>=2.31", "apscheduler>=3.10"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "black>=24.1", "ruff>=0.3", "mypy>=1.8"]
plots = ["matplotlib>=3.8", "seaborn>=0.13"]

[project.scripts]
nba-sh = "nba_sh.cli:main"

[tool.setuptools.packages.find]
include = ["nba_sh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: pruebas unitarias rápidas y deterministas",
    "integration: pruebas que recorren varias capas del pipeline",
]

[tool.coverage.run]
source = ["nba_sh"]
omit = ["nba_sh/__main__.py"]

[tool.black]
line-length = 90
target-version = ["py311"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
